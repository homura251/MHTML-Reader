name: Bootstrap repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk* | tr -d '\n' | base64 --decode > /tmp/mhtml-reader.zip
          unzip -t /tmp/mhtml-reader.zip
          rm -rf /tmp/mhtml-reader-src
          mkdir -p /tmp/mhtml-reader-src
          unzip -q /tmp/mhtml-reader.zip -d /tmp/mhtml-reader-src
          test -f /tmp/mhtml-reader-src/MhtmlLens/settings.gradle.kts
          test -f /tmp/mhtml-reader-src/MhtmlLens/app/src/main/AndroidManifest.xml

      - name: Restore project tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '.git/' --exclude '.github/workflows/' /tmp/mhtml-reader-src/MhtmlLens/ ./
          git status --short

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add MHTML Reader Android app"
          git push origin HEAD:main
